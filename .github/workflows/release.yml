name: Release builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Create or reuse draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo 'Tag must match package.json version'; exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Show My Limits $VERSION" --notes-file docs/RELEASE-NOTES.md
          fi
          ID=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.id')
          DRAFT=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.draft')
          test "$DRAFT" = true || { echo 'Refusing to modify a published release'; exit 1; }
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            key: darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            key: darwin-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            key: windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            key: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xdg-utils
      - run: npm ci
      - run: npm test
      - run: node scripts/check-release.mjs
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          releaseAssetNamePattern: show-my-limits_[version]_${{ matrix.key }}[setup][ext]
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate complete update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p signatures
          gh release download "$RELEASE_TAG" --pattern '*.sig' --dir signatures
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          node scripts/update-manifest.mjs release-assets.json signatures latest.json
          gh release upload "$RELEASE_TAG" latest.json --clobber
      - name: Summarize
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "### Builds are ready in draft $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "The updater sees this release only after it is published as a stable release." >> "$GITHUB_STEP_SUMMARY"
