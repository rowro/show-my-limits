[package]
name = "sml"
version = "0.3.1"
edition = "2024"
description = "Show My Limits terminal quota monitor"
authors = ["rowro <rowro.dev@gmail.com>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
zip = { version = "6", default-features = false, features = ["deflate"] }
tempfile = "3"
x509-parser = { version = "0.18", features = ["verify"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
time = "0.3"
ring = "0.17"
dirs = "6"
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
